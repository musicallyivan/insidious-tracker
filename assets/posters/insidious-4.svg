<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050806"/>
      <stop offset="50%" stop-color="#0d1c13"/>
      <stop offset="100%" stop-color="#020503"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#004d40" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg4)"/>
  <circle cx="250" cy="300" r="230" fill="url(#greenGlow)"/>

  <!-- Keyface Demon silhouette with Key fingers -->
  <g opacity="0.9">
    <!-- Hand with Key fingers -->
    <path d="M 250 160 C 210 160, 190 200, 190 250 C 190 320, 220 380, 250 420 C 280 380, 310 320, 310 250 C 310 200, 290 160, 250 160 Z" fill="#030a06" stroke="#00e676" stroke-width="1.5"/>
    
    <!-- Key Finger shapes -->
    <line x1="200" y1="220" x2="160" y2="170" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
    <circle cx="155" cy="165" r="8" fill="none" stroke="#d4a574" stroke-width="2"/>
    
    <line x1="230" y1="200" x2="210" y2="130" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
    <circle cx="208" cy="122" r="8" fill="none" stroke="#d4a574" stroke-width="2"/>
    
    <line x1="270" y1="200" x2="290" y2="130" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
    <circle cx="292" cy="122" r="8" fill="none" stroke="#d4a574" stroke-width="2"/>

    <line x1="300" y1="220" x2="340" y2="170" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
    <circle cx="345" cy="165" r="8" fill="none" stroke="#d4a574" stroke-width="2"/>
  </g>

  <!-- Glowing Keyhole in chest -->
  <path d="M 250 310 A 10 10 0 1 0 250 330 L 254 345 L 246 345 Z" fill="#00e676" filter="drop-shadow(0px 0px 10px #00e676)"/>

  <!-- Border -->
  <rect width="500" height="750" fill="none" stroke="#00e676" stroke-width="2" opacity="0.3"/>

  <!-- Titles -->
  <text x="250" y="70" font-family="'Cinzel', 'Georgia', serif" font-size="13" font-weight="600" fill="#00e676" letter-spacing="5" text-anchor="middle">ENFRÉNTATE A TUS DEMONIOS</text>
  
  <text x="250" y="605" font-family="'Creepster', 'Impact', sans-serif" font-size="44" fill="#ffffff" letter-spacing="6" text-anchor="middle" filter="drop-shadow(0px 0px 8px #00e676)">INSIDIOUS</text>
  <text x="250" y="640" font-family="'Impact', sans-serif" font-size="22" fill="#00e676" letter-spacing="4" text-anchor="middle">LA ÚLTIMA LLAVE (2018)</text>
  
  <text x="250" y="675" font-family="'Courier New', monospace" font-size="13" fill="#d4a574" letter-spacing="3" text-anchor="middle">THE LAST KEY · EL DEMONIO KEYFACE</text>
</svg>
