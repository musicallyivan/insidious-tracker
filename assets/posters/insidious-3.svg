<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0503"/>
      <stop offset="50%" stop-color="#1c0b05"/>
      <stop offset="100%" stop-color="#050201"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#b30000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg3)"/>
  <circle cx="250" cy="300" r="220" fill="url(#amberGlow)"/>

  <!-- Apartment Window with breathing demon silhouette -->
  <rect x="160" y="160" width="180" height="280" fill="#080302" stroke="#ff6b00" stroke-width="3" opacity="0.8"/>
  <line x1="250" y1="160" x2="250" y2="440" stroke="#ff6b00" stroke-width="1.5" opacity="0.5"/>
  <line x1="160" y1="300" x2="340" y2="300" stroke="#ff6b00" stroke-width="1.5" opacity="0.5"/>

  <!-- The Man Who Can't Breathe silhouette -->
  <path d="M 210 240 C 230 200, 270 200, 290 240 L 310 400 L 190 400 Z" fill="#020101" stroke="#ff3300" stroke-width="1.5"/>
  <rect x="220" y="270" width="60" height="15" fill="#e0e0e0" opacity="0.6"/> <!-- Oxygen mask -->
  <line x1="250" y1="285" x2="250" y2="350" stroke="#888888" stroke-width="3"/> <!-- Tube -->

  <!-- Elise's Lantern -->
  <circle cx="150" cy="460" r="14" fill="#ffe066" filter="drop-shadow(0px 0px 12px #ff9900)"/>
  <rect x="142" y="442" width="16" height="36" fill="none" stroke="#d4a574" stroke-width="2"/>

  <!-- Border -->
  <rect width="500" height="750" fill="none" stroke="#ff6b00" stroke-width="2" opacity="0.3"/>

  <!-- Titles -->
  <text x="250" y="70" font-family="'Cinzel', 'Georgia', serif" font-size="13" font-weight="600" fill="#ff6b00" letter-spacing="5" text-anchor="middle">ASÍ ES CÓMO EMPEZÓ TODO</text>
  
  <text x="250" y="605" font-family="'Creepster', 'Impact', sans-serif" font-size="46" fill="#ffffff" letter-spacing="6" text-anchor="middle" filter="drop-shadow(0px 0px 8px #ff6b00)">INSIDIOUS</text>
  <text x="250" y="640" font-family="'Impact', sans-serif" font-size="24" fill="#ff6b00" letter-spacing="4" text-anchor="middle">CAPÍTULO 3 (2015)</text>
  
  <text x="250" y="675" font-family="'Courier New', monospace" font-size="13" fill="#d4a574" letter-spacing="3" text-anchor="middle">PRECUELA · EL ORIGEN DE ELISE RAINIER</text>
</svg>
