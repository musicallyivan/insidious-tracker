<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0204"/>
      <stop offset="50%" stop-color="#24070e"/>
      <stop offset="100%" stop-color="#050102"/>
    </linearGradient>
    <radialGradient id="redDoorGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff002b" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#800010" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg5)"/>
  <circle cx="250" cy="300" r="240" fill="url(#redDoorGlow)"/>

  <!-- Iconic RED DOOR -->
  <g filter="drop-shadow(0px 0px 20px #ff002b)">
    <!-- Door Frame -->
    <rect x="150" y="140" width="200" height="360" fill="#0d0205" stroke="#ff002b" stroke-width="6"/>
    <!-- Door Panel (Ajar) -->
    <path d="M 155 145 L 320 180 L 320 480 L 155 495 Z" fill="#b3001b" stroke="#ff2a4a" stroke-width="2"/>
    <circle cx="305" cy="330" r="7" fill="#ffd700"/>
    <!-- Dark demonic hands reaching out from the door opening -->
    <path d="M 320 220 Q 360 210 390 230 M 320 280 Q 370 285 400 270 M 320 360 Q 360 380 395 350" stroke="#000000" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Father & Son silhouette (Josh & Dalton) -->
  <path d="M 180 520 L 210 440 L 235 520 Z" fill="#050103"/>
  <circle cx="195" cy="430" r="12" fill="#050103"/>
  
  <path d="M 260 520 L 285 460 L 310 520 Z" fill="#050103"/>
  <circle cx="272" cy="452" r="10" fill="#050103"/>

  <!-- Border -->
  <rect width="500" height="750" fill="none" stroke="#ff002b" stroke-width="2" opacity="0.4"/>

  <!-- Titles -->
  <text x="250" y="70" font-family="'Cinzel', 'Georgia', serif" font-size="13" font-weight="600" fill="#ff002b" letter-spacing="5" text-anchor="middle">ACABA DONDE TODO COMENZÓ</text>
  
  <text x="250" y="600" font-family="'Creepster', 'Impact', sans-serif" font-size="44" fill="#ffffff" letter-spacing="6" text-anchor="middle" filter="drop-shadow(0px 0px 10px #ff002b)">INSIDIOUS</text>
  <text x="250" y="635" font-family="'Impact', sans-serif" font-size="22" fill="#ff002b" letter-spacing="4" text-anchor="middle">LA PUERTA ROJA (2023)</text>
  
  <text x="250" y="670" font-family="'Courier New', monospace" font-size="13" fill="#d4a574" letter-spacing="3" text-anchor="middle">THE RED DOOR · PATRICK WILSON</text>
</svg>
