<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0209"/>
      <stop offset="50%" stop-color="#2a0518"/>
      <stop offset="100%" stop-color="#050004"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#e91e63" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#9c27b0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg6)"/>
  <circle cx="250" cy="300" r="240" fill="url(#purpleGlow)"/>

  <!-- Portal / Swirling Further Vortex -->
  <ellipse cx="250" cy="280" rx="140" ry="180" fill="none" stroke="#e91e63" stroke-width="4" stroke-dasharray="15 10" filter="drop-shadow(0px 0px 15px #e91e63)"/>
  <ellipse cx="250" cy="280" rx="100" ry="130" fill="none" stroke="#9c27b0" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Glowing Red Door inside the Vortex -->
  <rect x="210" y="210" width="80" height="140" fill="#ff0033" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0px 0px 12px #ff0033)"/>

  <!-- Sinister hands surrounding portal -->
  <path d="M 80 280 C 120 270, 150 280, 170 300 M 420 280 C 380 270, 350 280, 330 300 M 250 100 C 240 140, 250 160, 250 180" stroke="#ff80ab" stroke-width="3" stroke-linecap="round"/>

  <!-- Badge for 2026 -->
  <rect x="180" y="470" width="140" height="30" rx="15" fill="rgba(233, 30, 99, 0.3)" stroke="#e91e63" stroke-width="1.5"/>
  <text x="250" y="490" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#ffd700" letter-spacing="2" text-anchor="middle">ESTRENO 2026</text>

  <!-- Border -->
  <rect width="500" height="750" fill="none" stroke="#e91e63" stroke-width="2" opacity="0.4"/>

  <!-- Titles -->
  <text x="250" y="70" font-family="'Cinzel', 'Georgia', serif" font-size="12" font-weight="600" fill="#e91e63" letter-spacing="5" text-anchor="middle">EL MÁS ALLÁ RECLAMA LO SUYO</text>
  
  <text x="250" y="595" font-family="'Creepster', 'Impact', sans-serif" font-size="40" fill="#ffffff" letter-spacing="5" text-anchor="middle" filter="drop-shadow(0px 0px 10px #e91e63)">INSIDIOUS</text>
  <text x="250" y="630" font-family="'Impact', sans-serif" font-size="20" fill="#ffd700" letter-spacing="3" text-anchor="middle">OUT OF THE FURTHER (2026)</text>
  
  <text x="250" y="665" font-family="'Courier New', monospace" font-size="12" fill="#d4a574" letter-spacing="2" text-anchor="middle">NUEVA ENTREGA PRINCIPAL · BLUMHOUSE</text>
</svg>
