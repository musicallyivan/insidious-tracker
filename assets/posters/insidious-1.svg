<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090408"/>
      <stop offset="50%" stop-color="#18070d"/>
      <stop offset="100%" stop-color="#040204"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff1a3c" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#800014" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="50%" stop-color="#ff3300"/>
      <stop offset="100%" stop-color="#880000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurFog">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="750" fill="url(#bg1)"/>
  
  <!-- Red Ambient Glow -->
  <circle cx="250" cy="320" r="220" fill="url(#redGlow)"/>

  <!-- Bedroom silhouette / Red Door framing -->
  <rect x="140" y="140" width="220" height="380" rx="8" fill="none" stroke="#d32f2f" stroke-width="4" opacity="0.7"/>
  <rect x="155" y="155" width="190" height="350" fill="#0c0408" stroke="#ff1a3c" stroke-width="1.5" opacity="0.8"/>
  <circle cx="325" cy="330" r="6" fill="#ffd700"/>

  <!-- Lipstick-Face Demon Silhouette & Eyes -->
  <g opacity="0.85">
    <!-- Horns & Head outline -->
    <path d="M 210 220 Q 230 180 250 200 Q 270 180 290 220 Q 300 280 250 310 Q 200 280 210 220 Z" fill="#050103" stroke="#e60026" stroke-width="2"/>
    <!-- Glowing yellow/red demon eyes -->
    <ellipse cx="230" cy="245" rx="10" ry="6" fill="url(#eyeGlow)"/>
    <ellipse cx="270" cy="245" rx="10" ry="6" fill="url(#eyeGlow)"/>
    <circle cx="230" cy="245" r="3" fill="#ffffff"/>
    <circle cx="270" cy="245" r="3" fill="#ffffff"/>
    <!-- Red face paint streaks -->
    <path d="M 225 255 L 220 285 M 275 255 L 280 285 M 250 240 L 250 270" stroke="#ff1a3c" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Boy in bed silhouette -->
  <path d="M 120 500 C 180 480, 320 480, 380 500 L 420 560 L 80 560 Z" fill="#080306"/>
  <circle cx="200" cy="465" r="22" fill="#14080e"/>

  <!-- Vignette -->
  <rect width="500" height="750" fill="none" stroke="#ff1a3c" stroke-width="2" opacity="0.3"/>

  <!-- Typography -->
  <text x="250" y="70" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="14" font-weight="600" fill="#e60026" letter-spacing="6" text-anchor="middle">DEL DIRECTOR DE SAW Y EL CONJURO</text>
  
  <text x="250" y="620" font-family="'Creepster', 'Impact', sans-serif" font-size="52" fill="#ffffff" letter-spacing="8" text-anchor="middle" filter="drop-shadow(0px 0px 10px #ff1a3c)">INSIDIOUS</text>
  
  <text x="250" y="655" font-family="'Courier New', monospace" font-size="14" fill="#d4a574" letter-spacing="4" text-anchor="middle">LA NOCHE DEL DEMONIO (2010)</text>
  <text x="250" y="685" font-family="sans-serif" font-size="11" fill="#8a6a4a" letter-spacing="2" text-anchor="middle">IT'S NOT THE HOUSE THAT IS HAUNTED.</text>
</svg>
