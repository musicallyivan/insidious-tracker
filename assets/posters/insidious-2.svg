<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04070a"/>
      <stop offset="50%" stop-color="#0c161d"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#00bcd4" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#ff1a3c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg2)"/>
  <circle cx="250" cy="300" r="230" fill="url(#cyanGlow)"/>

  <!-- Bride in Black Veil silhouette -->
  <g opacity="0.9">
    <!-- Wedding Veil background -->
    <path d="M 150 180 Q 250 120 350 180 L 380 480 Q 250 530 120 480 Z" fill="#03080c" stroke="#00bcd4" stroke-width="1" opacity="0.8"/>
    <!-- Black Dress figure -->
    <path d="M 210 220 C 220 180, 280 180, 290 220 L 330 460 L 170 460 Z" fill="#010305" stroke="#ff1a3c" stroke-width="1.5"/>
    <!-- Pale face mask under veil -->
    <ellipse cx="250" cy="240" rx="22" ry="32" fill="#e0e6ed" opacity="0.85"/>
    <ellipse cx="240" cy="235" rx="5" ry="7" fill="#000000"/>
    <ellipse cx="260" cy="235" rx="5" ry="7" fill="#000000"/>
    <path d="M 242 260 Q 250 268 258 260" stroke="#000000" stroke-width="2" fill="none"/>
  </g>

  <!-- Old Metronome / Clock overlay -->
  <path d="M 250 360 L 220 450 L 280 450 Z" fill="none" stroke="#d4a574" stroke-width="2" opacity="0.6"/>
  <line x1="250" y1="440" x2="235" y2="370" stroke="#ff1a3c" stroke-width="3"/>

  <!-- Border -->
  <rect width="500" height="750" fill="none" stroke="#00bcd4" stroke-width="2" opacity="0.3"/>

  <!-- Titles -->
  <text x="250" y="70" font-family="'Cinzel', 'Georgia', serif" font-size="13" font-weight="600" fill="#00bcd4" letter-spacing="5" text-anchor="middle">LO QUE ESTÁ MUERTO NO DESCANSA</text>
  
  <text x="250" y="605" font-family="'Creepster', 'Impact', sans-serif" font-size="46" fill="#ffffff" letter-spacing="6" text-anchor="middle" filter="drop-shadow(0px 0px 8px #00bcd4)">INSIDIOUS</text>
  <text x="250" y="640" font-family="'Impact', sans-serif" font-size="24" fill="#ff1a3c" letter-spacing="4" text-anchor="middle">CAPÍTULO 2 (2013)</text>
  
  <text x="250" y="675" font-family="'Courier New', monospace" font-size="13" fill="#d4a574" letter-spacing="3" text-anchor="middle">CHAPTER 2 · EL SECRETO DE PARKER CRANE</text>
</svg>
