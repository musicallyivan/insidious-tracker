<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040608"/>
      <stop offset="50%" stop-color="#0f1924"/>
      <stop offset="100%" stop-color="#020304"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#0288d1" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#01579b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="750" fill="url(#bg7)"/>
  <circle cx="250" cy="300" r="230" fill="url(#blueGlow)"/>

  <!-- Spell / Thread weaving artwork -->
  <g opacity="0.85">
    <path d="M 120 180 Q 250 320 380 180 Q 250 480 120 180 Z" fill="none" stroke="#0288d1" stroke-width="3"/>
    <path d="M 180 140 Q 250 350 320 140 Q 250 420 180 140 Z" fill="none" stroke="#ffd700" stroke-width="2"/>
    <circle cx="250" cy="280" r="16" fill="#0288d1" filter="drop-shadow(0px 0px 10px #0288d1)"/>
  </g>

  <!-- Titles -->
  <text x="250" y="70" font-family="'Cinzel', 'Georgia', serif" font-size="12" font-weight="600" fill="#0288d1" letter-spacing="5" text-anchor="middle">SPIN-OFF OFICIAL DE LA SAGA</text>
  
  <text x="250" y="595" font-family="'Creepster', 'Impact', sans-serif" font-size="40" fill="#ffffff" letter-spacing="5" text-anchor="middle" filter="drop-shadow(0px 0px 10px #0288d1)">THREAD</text>
  <text x="250" y="630" font-family="'Impact', sans-serif" font-size="20" fill="#0288d1" letter-spacing="3" text-anchor="middle">AN INSIDIOUS TALE (TBA)</text>
  
  <text x="250" y="665" font-family="'Courier New', monospace" font-size="12" fill="#d4a574" letter-spacing="2" text-anchor="middle">MANDY MOORE &amp; KUMAIL NANJIANI</text>
</svg>
